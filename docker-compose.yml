services:
  # --- WealthTrack ---
  wealthtrack-db:
    image: postgres:16-alpine
    container_name: wealthtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthtrack
      POSTGRES_PASSWORD: wealthtrack_dev
      POSTGRES_DB: wealthtrack
    ports:
      - "5432:5432"
    volumes:
      - wealthtrack_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  wealthtrack-app:
    build:
      context: ../wealthtrack
      dockerfile: Dockerfile
    container_name: wealthtrack-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../wealthtrack/.env.local
    environment:
      DATABASE_URL: postgresql://wealthtrack:wealthtrack_dev@wealthtrack-db:5432/wealthtrack
      NODE_ENV: production
    depends_on:
      wealthtrack-db:
        condition: service_healthy

  # --- Crypto Tracker (InvestTracker, repo "file-importer", local dir "investracker") ---
  # Same host port (5435) and volume paths as investracker/docker/docker-compose.yml
  # on purpose — this is meant to be the same database, not a second one. Don't run
  # both compose files' postgres service at the same time.
  crypto-db:
    image: postgres:13.1
    container_name: crypto-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: importer_database
    ports:
      - "5435:5432"
    volumes:
      - ../investracker/docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../investracker/docker/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "importer_database", "-U", "root"]
      timeout: 45s
      interval: 10s
      retries: 10

  crypto-redis:
    image: redis:7-alpine
    container_name: crypto-redis
    restart: unless-stopped
    # No host port published on purpose — 6379 is already used by other local
    # redis containers on this machine. crypto-api only needs to reach this
    # over the compose network (service name "crypto-redis"), not from the host.

  crypto-api:
    build:
      context: ../investracker
      dockerfile: Dockerfile
    container_name: crypto-api
    ports:
      - "9080:9080"
    depends_on:
      crypto-db:
        condition: service_healthy
      crypto-redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://crypto-db:5432/importer_database?currentSchema=file_importer_schema,public
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: crypto-redis

  crypto-ui:
    build:
      context: ../importer-porfolio
      dockerfile: Dockerfile
    container_name: crypto-ui
    ports:
      - "3001:80"
    depends_on:
      - crypto-api

volumes:
  wealthtrack_data:
