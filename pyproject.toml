[project]
name = "project-hub"
version = "0.1.0"
description = "AI orchestration service for the /devs/projects workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.0.17",
    "openai>=1.85.0",
    "mcp[cli]>=1.9.3",
    "gradio>=5.22.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "click>=8.0.0",
    "rich>=14.0.0",
]

[project.scripts]
hub = "hub.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
